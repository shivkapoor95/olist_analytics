version: 2

sources:
  - name: olist
    database: olist
    description: "Raw Olist Brazilian e-commerce data loaded from CSV files into PostgreSQL."
    schema: public
    tables:
      - name: olist_orders_dataset
        description: "Dataset containing order related information."
        columns:
          - name: order_id
            description: "Unique identifier for each order."
          - name: customer_id
            description: "References the customer who placed the order."
          - name: order_status
            description: "Current status of the order e.g. delivered, shipped, cancelled."
          - name: order_purchase_timestamp
            description: "Timestamp when the order was placed by the customer."
          - name: order_approved_at
            description: "Timestamp when the order payment was approved."
          - name: order_delivered_carrier_date
            description: "Timestamp when the order was handed to the carrier."
          - name: order_delivered_customer_date
            description: "Timestamp when the order was delivered to the customer."
          - name: order_estimated_delivery_date
            description: "Estimated delivery date provided to the customer at time of purchase."

      - name: olist_order_items_dataset
        description: "Dataset containing information of items in each order."
        columns:
          - name: order_id
            description: "References the order this item belongs to."
          - name: order_item_id
            description: "Sequential number identifying the item within an order."
          - name: product_id
            description: "References the product that was purchased."
          - name: seller_id
            description: "References the seller who sold the item."
          - name: shipping_limit_date
            description: "Deadline for the seller to hand the item to the carrier."
          - name: price
            description: "Price of the item in Brazilian Real."
          - name: freight_value
            description: "Freight cost for the item in Brazilian Real."

      - name: olist_customers_dataset
        description: "Dataset containing information of customers."
        columns:
          - name: customer_id
            description: "Unique identifier per order — same customer gets a new id for each order."
          - name: customer_unique_id
            description: "True unique identifier for a customer across all orders."
          - name: customer_zip_code_prefix
            description: "Zip code prefix of the customer's location."
          - name: customer_city
            description: "City of the customer."
          - name: customer_state
            description: "State of the customer."

      - name: olist_geolocation_dataset
        description: "Dataset containing geolocation information for Brazilian zip codes."
        columns:
          - name: geolocation_zip_code_prefix
            description: "Zip code prefix."
          - name: geolocation_lat
            description: "Latitude coordinate."
          - name: geolocation_lng
            description: "Longitude coordinate."
          - name: geolocation_city
            description: "City name."
          - name: geolocation_state
            description: "State code."

      - name: olist_order_payments_dataset
        description: "Dataset containing payment information for each order."
        columns:
          - name: order_id
            description: "References the order this payment belongs to."
          - name: payment_sequential
            description: "Sequence number for payments — an order can have multiple payment methods."
          - name: payment_type
            description: "Payment method used e.g. credit_card, boleto, voucher."
          - name: payment_installments
            description: "Number of installments chosen by the customer."
          - name: payment_value
            description: "Transaction value in Brazilian Real."

      - name: olist_order_reviews_dataset
        description: "Dataset containing customer reviews and scores for each order."
        columns:
          - name: review_id
            description: "Unique identifier for each review."
          - name: order_id
            description: "References the order being reviewed."
          - name: review_score
            description: "Customer satisfaction score from 1 (worst) to 5 (best)."
          - name: review_comment_title
            description: "Title of the review left by the customer."
          - name: review_comment_message
            description: "Full review message left by the customer."
          - name: review_creation_date
            description: "Date the review survey was sent to the customer."
          - name: review_answer_timestamp
            description: "Timestamp when the customer submitted the review."

      - name: olist_products_dataset
        description: "Dataset containing product details and categories."
        columns:
          - name: product_id
            description: "Unique identifier for each product."
          - name: product_category_name
            description: "Category name of the product in Portuguese."
          - name: product_name_lenght
            description: "Length of the product name in characters."
          - name: product_description_lenght
            description: "Length of the product description in characters."
          - name: product_photos_qty
            description: "Number of photos published for the product."
          - name: product_weight_g
            description: "Product weight in grams."
          - name: product_length_cm
            description: "Product length in centimeters."
          - name: product_height_cm
            description: "Product height in centimeters."
          - name: product_width_cm
            description: "Product width in centimeters."

      - name: olist_sellers_dataset
        description: "Dataset containing seller information and location."
        columns:
          - name: seller_id
            description: "Unique identifier for each seller."
          - name: seller_zip_code_prefix
            description: "Zip code prefix of the seller's location."
          - name: seller_city
            description: "City where the seller is located."
          - name: seller_state
            description: "State where the seller is located."

      - name: product_category_name_translation
        description: "Dataset containing Portuguese to English translation of product category names."
        columns:
          - name: product_category_name
            description: "Product category name in Portuguese."
          - name: product_category_name_english
            description: "Product category name translated to English."